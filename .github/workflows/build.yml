name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: v2_minimap
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Check code syntax
        shell: bash
        run: |
          echo "=== syntax check ==="
          for f in *.py; do
            echo "check: $f"
            python -m py_compile "$f"
          done
          echo "[OK] all files syntax OK"
      
      - name: Verify functionality
        env:
          PYTHONIOENCODING: utf-8
        run: |
          echo "=== verify ==="
          python verify_build.py
      
      - name: Build CLI version
        run: |
          pyinstaller --onefile --clean --noconfirm `
            --name "95CM-AutoBot-CLI" --console `
            --hidden-import win32gui --hidden-import win32con --hidden-import win32api `
            --hidden-import win32ui --hidden-import keyboard --hidden-import cv2 `
            --hidden-import numpy --hidden-import npc_teleporter --hidden-import class_skills `
            --hidden-import bot_engine --hidden-import auto_nav --hidden-import map_detector --hidden-import status_monitor `
            --add-data "bot_config_v2.ini;." `
            mir2_auto_bot_v2.py
      
      - name: Build GUI version
        run: |
          pyinstaller --onefile --clean --noconfirm --name "95CM-AutoBot-GUI" --windowed `
            --hidden-import win32gui --hidden-import win32con --hidden-import win32api `
            --hidden-import win32ui --hidden-import keyboard --hidden-import cv2 `
            --hidden-import numpy --hidden-import Pillow --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk --hidden-import customtkinter `
            --hidden-import map_detector --hidden-import status_monitor `
            --hidden-import class_skills --hidden-import auto_nav `
            --hidden-import npc_teleporter --hidden-import bot_engine `
            --add-data "bot_config_v2.ini;." `
            mir2_bot_gui_v2.py
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 95CM-AutoBot-Exe
          path: |
            v2_minimap/dist/95CM-AutoBot-CLI.exe
            v2_minimap/dist/95CM-AutoBot-GUI.exe
      
      - name: Delete old release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete v1.0 --repo ${{ github.repository }} --yes 2>&1
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          target_commitish: ${{ github.sha }}
          name: v1.0 - 95CM AutoBot (latest)
          body: |
            ## 95CM AutoBot v1.0
            
            ### Features
            - NPC teleporter auto-dungeon
            - Minimap red dot detection + auto combat
            - Multi-skill attack (F1,F2,F3...)
            - Auto class skills (potions/summon/buff)
            - Yellow dot avoidance (auto teleport when players detected)
            - Window selection with list fallback
            
            ### Usage
            Download and run. Config file auto-created at exe path.
          files: |
            v2_minimap/dist/95CM-AutoBot-CLI.exe
            v2_minimap/dist/95CM-AutoBot-GUI.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}