name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: v2_minimap
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: 检查代码语法
        run: |
          echo "=== 语法检查 ==="
          for f in *.py; do
            echo "检查: $f"
            python -m py_compile "$f"
          done
          echo "✅ 所有文件语法正确"
      
      - name: 验证功能（关键方法 + 配置加载）
        run: |
          pip install opencv-python-headless numpy
          echo "=== 功能验证 ==="
          python verify_build.py
      
      - name: Build CLI version (mir2_auto_bot_v2.py)
        run: |
          pyinstaller --onefile --clean --noconfirm `
            --name "95CM-AutoBot-CLI" --console `
            --hidden-import win32gui --hidden-import win32con --hidden-import win32api `
            --hidden-import win32ui --hidden-import keyboard --hidden-import cv2 `
            --hidden-import numpy --hidden-import npc_teleporter --hidden-import class_skills `
            --hidden-import bot_engine --hidden-import auto_nav --hidden-import map_detector --hidden-import status_monitor `
            --add-data "bot_config_v2.ini;." `
            mir2_auto_bot_v2.py
      
      - name: Build GUI version (mir2_bot_gui_v2.py)
        run: |
          pyinstaller --onefile --clean --noconfirm --name "95CM-AutoBot-GUI" --windowed `
            --hidden-import win32gui --hidden-import win32con --hidden-import win32api `
            --hidden-import win32ui --hidden-import keyboard --hidden-import cv2 `
            --hidden-import numpy --hidden-import Pillow --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk --hidden-import customtkinter `
            --hidden-import map_detector --hidden-import status_monitor `
            --hidden-import class_skills --hidden-import auto_nav `
            --hidden-import npc_teleporter --hidden-import bot_engine `
            --add-data "bot_config_v2.ini;." `
            mir2_bot_gui_v2.py
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 95CM-AutoBot-Exe
          path: |
            v2_minimap/dist/95CM-AutoBot-CLI.exe
            v2_minimap/dist/95CM-AutoBot-GUI.exe
      
      - name: 删除旧Release（v1.0）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete v1.0 --repo ${{ github.repository }} --yes 2>&1
      
      - name: 创建 Release v1.0（覆盖更新）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          target_commitish: ${{ github.sha }}
          name: v1.0 - 95沉默自动挂机（最新版）
          body: |
            ## 95沉默自动挂机脚本 v1.0
            
            ### 功能
            - 🚪 NPC传送员自动下图
            - 🎯 小地图红点检测+自动找怪打怪
            - ⚔️ 多技能循环攻击（F1,F2,F3...）
            - 💊 职业自动技能（喝药/召唤/加Buff）
            - 🟡 黄点躲避（检测到其他玩家自动飞）
            - 🪟 窗口选择：找不到匹配窗口时列出所有窗口让你选
            
            ### 下载说明
            下载后双击运行即可。会自动在exe目录生成 bot_config_v2.ini 配置文件。
            
            ### 配置（记事本打开bot_config_v2.ini）
            - NPC坐标：`npc_x / npc_y`
            - 攻击键：`attack_keys = F1,F2,F3`
            - 目标地图：`target_dungeon = 石墓阵`
          files: |
            v2_minimap/dist/95CM-AutoBot-CLI.exe
            v2_minimap/dist/95CM-AutoBot-GUI.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}